name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run
      - run: node --input-type=module -e "import { JsonDocument, SurfaceSnapshot } from '@0al/agent-surface'; if (!new SurfaceSnapshot(new JsonDocument('{}')).hash().startsWith('sha-256:')) process.exit(1)"
  spec-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-spec-lock.mjs
