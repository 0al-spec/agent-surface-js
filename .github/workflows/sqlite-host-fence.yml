name: Non-live SQLite host fence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/sqlite-host-fence
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: experiments/sqlite-host-fence/go.mod
          cache-dependency-path: experiments/sqlite-host-fence/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=2m ./...
